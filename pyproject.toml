[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lxscp"
version = "0.2.0"
description = "A WinSCP-style graphical SFTP client for Linux and macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "narl3yyy-svg" }]
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.2", "paramiko>=2.11", "keyring>=23"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
]

[project.urls]
Homepage = "https://github.com/narl3yyy-svg/LXSCP"

[project.gui-scripts]
lxscp = "lxscp.app:main"

[tool.setuptools]
packages = ["lxscp", "lxscp.icons"]

[tool.setuptools.package-data]
"lxscp.icons" = ["*.png", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
