[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lxscp"
version = "0.1.0"
description = "A WinSCP-style graphical SFTP client for Linux"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "narl3yyy-svg" }]
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.2", "paramiko>=2.11", "keyring>=23"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
]

[project.urls]
Homepage = "https://github.com/narl3yyy-svg/LXSCP"

[project.gui-scripts]
lxscp = "lxscp.app:main"

[tool.setuptools]
packages = ["lxscp"]

[tool.setuptools.package-data]
lxscp = ["icons/*.png", "icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
